name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ci:ci-ephemeral@127.0.0.1:5432/ci?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate and verify dependencies
        run: |
          make bootstrap
          git diff --exit-code -- go.mod go.sum internal/graph/generated/generated.go internal/graph/model/models_gen.go internal/graph/resolver/schema.resolvers.go
          cp internal/graph/generated/generated.go /tmp/commeng-generated.go
          cp internal/graph/model/models_gen.go /tmp/commeng-models.go
          cp internal/graph/resolver/schema.resolvers.go /tmp/commeng-resolvers.go
          make generate
          cmp -s /tmp/commeng-generated.go internal/graph/generated/generated.go
          cmp -s /tmp/commeng-models.go internal/graph/model/models_gen.go
          cmp -s /tmp/commeng-resolvers.go internal/graph/resolver/schema.resolvers.go
      - name: Format, vet, unit, race and integration
        run: |
          make check
          make vet
          go vet -tags=integration ./...
          make integration
      - name: Known-vulnerability scan
        run: make vuln
      - name: Container smoke test
        run: |
          docker build -t commeng:ci .
          docker run -d --name commeng-ci \
            -p 127.0.0.1:18086:8080 \
            -e STORAGE=memory \
            -e PUBLIC_BASE_URL=http://localhost:8080 \
            commeng:ci serve --storage memory
          trap 'docker rm -f commeng-ci >/dev/null 2>&1 || true' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 2 \
            -fsS http://127.0.0.1:18086/readyz
          curl -fsS http://127.0.0.1:18086/schema.graphql | grep 'type Comment' >/dev/null
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
