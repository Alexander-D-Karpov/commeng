# In nginx `http` context, before the server blocks:
map $http_upgrade $commeng_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=commeng_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name comment.akarpov.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name comment.akarpov.ru;

    # Replace these paths if the host uses a different certificate.
    ssl_certificate /etc/nginx/ssl/akarpov-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/akarpov-wildcard/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location = / {
        return 302 /docs/;
    }

    location / {
        limit_req zone=commeng_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:18086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $commeng_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
